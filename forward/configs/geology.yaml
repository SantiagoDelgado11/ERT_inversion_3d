geology:
  background:
    conductivity: 0.01  # 100 Ohm-m

  sphere:
    radius:
      min: 4.0
      max: 12.0
    conductivity:
      min: 0.0001  # Hasta 10,000 Ohm-m (muy resistivo)
      max: 1.0     # Hasta 1 Ohm-m (muy conductor)
    center:
      margin_x: 10.0   # Permite moverse más libremente en X
      margin_y: 5.0    # Permite moverse en Y
      min_depth: 8.0
      max_depth: 35.0
